<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#14283f">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="CFO Center">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icons/icon-192.png">
<link rel="apple-touch-icon" href="icons/icon-192.png">
<title>CFO Knowledge Center</title>
<style>
:root{--bg:#f3f6fa;--panel:#fff;--ink:#17283d;--muted:#66768a;--line:#e1e8f0;--nav:#14283f;--acc:#2a93ab;--acc2:#e1f3f6;--gold:#d8a94c;--ok:#2e9b6a;--bad:#d1495b;--shadow:0 6px 22px #14283f0d;--fs:17px}
html[data-theme=dark]{--bg:#0e1722;--panel:#16212f;--ink:#e6edf5;--muted:#92a3b6;--line:#243447;--nav:#0a1119;--acc:#5cc0d6;--acc2:#183240;--shadow:none}
@media(prefers-color-scheme:dark){html[data-theme=auto]{--bg:#0e1722;--panel:#16212f;--ink:#e6edf5;--muted:#92a3b6;--line:#243447;--nav:#0a1119;--acc:#5cc0d6;--acc2:#183240;--shadow:none}}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{margin:0;background:var(--bg);color:var(--ink);font-family:"Segoe UI",Tahoma,Arial,sans-serif;line-height:1.6}
button,input,textarea,select{font:inherit;color:inherit}button{cursor:pointer}
a{color:var(--acc)}
.side{position:fixed;inset-block:0;inset-inline-start:0;width:240px;background:var(--nav);color:#fff;padding:18px 12px;overflow:auto;z-index:20}
.brand{display:flex;gap:10px;align-items:center;padding:4px 8px 18px;border-bottom:1px solid #ffffff22}
.mark{width:38px;height:38px;border-radius:11px;background:#48a7bd;color:#09283b;display:grid;place-items:center;font-weight:700;font-size:20px}
.brand b{display:block;font-size:14px;letter-spacing:.4px}.brand small{color:#9fb8c9;font-size:10px}
.nb{display:flex;gap:11px;align-items:center;width:100%;border:0;background:none;color:#c9d7e2;padding:10px 12px;border-radius:9px;font-size:14px;margin:2px 0;text-align:start}
.nb:hover,.nb.on{background:#ffffff17;color:#fff}.nb .i{width:20px;text-align:center}
.nb .bd{margin-inline-start:auto;background:var(--gold);color:#222;border-radius:20px;font-size:11px;padding:0 7px;font-weight:700}
.main{margin-inline-start:240px;padding:18px 26px 60px;max-width:1100px}
.top{display:flex;gap:10px;align-items:center;margin-bottom:16px}
.top input{flex:1;min-width:0;padding:10px 14px;border:1px solid var(--line);border-radius:10px;background:var(--panel);outline:none}
.ib{border:1px solid var(--line);background:var(--panel);color:var(--ink);border-radius:10px;padding:9px 12px;font-size:13px}
.btn{border:1px solid var(--line);background:var(--panel);color:var(--ink);border-radius:10px;padding:9px 14px;font-size:13px}
.btn.p{background:var(--nav);border-color:var(--nav);color:#fff}html[data-theme=dark] .btn.p{background:var(--acc);border-color:var(--acc);color:#06222c}
.btn.t{background:var(--acc);border-color:var(--acc);color:#fff}.btn.sm{padding:6px 10px;font-size:12px}.btn.bad{color:var(--bad)}
.btn:active{transform:scale(.97)}
h1{font-size:24px;margin:6px 0 6px}h2{font-size:17px;margin:22px 0 10px}h3{font-size:15px;margin:16px 0 6px}
.sub{color:var(--muted);font-size:13px;margin:0 0 14px}
.card,.panel{background:var(--panel);border:1px solid var(--line);border-radius:14px;box-shadow:var(--shadow);padding:16px}
.card.k{cursor:pointer;transition:.15s}.card.k:hover{border-color:var(--acc);transform:translateY(-2px)}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:12px}
.row{display:flex;gap:10px;align-items:center}.row.sp{justify-content:space-between}.wrap{flex-wrap:wrap}.grow{flex:1;min-width:0}
.hero{background:linear-gradient(120deg,#14283f,#1c5a70);color:#fff;border-radius:18px;padding:22px;position:relative;overflow:hidden}
.hero p{color:#cfe3ec;margin:6px 0 0;font-size:14px}.hero .btn{margin-top:12px}
.bar{height:7px;background:var(--line);border-radius:9px;overflow:hidden}.bar i{display:block;height:100%;background:var(--acc)}.bar i.g{background:var(--ok)}
.tag{display:inline-block;background:var(--acc2);color:var(--acc);border-radius:20px;padding:2px 9px;font-size:11px;margin-inline-end:4px}
.muted{color:var(--muted)}.small{font-size:12px}
.dot{width:12px;height:12px;border-radius:50%;border:2px solid var(--line);flex:none}.dot.s1{background:var(--gold);border-color:var(--gold)}.dot.s2{background:var(--ok);border-color:var(--ok)}
.li{display:flex;gap:11px;align-items:center;padding:11px 4px;border-bottom:1px solid var(--line);cursor:pointer;text-decoration:none;color:inherit}
.li:last-child{border:0}.li:hover{background:var(--acc2)}
details{border:1px solid var(--line);border-radius:12px;background:var(--panel);margin:8px 0;overflow:hidden}
summary{padding:12px 14px;cursor:pointer;font-weight:600;list-style:none}summary::-webkit-details-marker{display:none}
details>.in{padding:0 12px 6px}
.lesson{font-size:var(--fs);line-height:2}.lesson h3{font-size:1.05em;color:var(--acc);margin:18px 0 4px}.lesson ul{padding-inline-start:22px;margin:4px 0}.lesson p{margin:6px 0}
.tip{background:#fff6e0;color:#6b4b00;border-inline-start:4px solid var(--gold);padding:9px 12px;border-radius:8px;margin:10px 0;font-size:.92em}
html[data-theme=dark] .tip{background:#3a2f12;color:#f1d58d}
.formula{direction:ltr;text-align:left;background:var(--acc2);border-radius:9px;padding:9px 12px;font-family:Consolas,monospace;font-size:.88em;margin:8px 0;overflow:auto;white-space:pre-wrap}
.seg{display:flex;border:1px solid var(--line);border-radius:10px;overflow:hidden}.seg button{flex:1;border:0;background:var(--panel);padding:9px 6px;font-size:13px}
.seg button.on{background:var(--acc);color:#fff}
.field{display:flex;flex-direction:column;gap:4px;margin:9px 0}.field label{font-size:12px;color:var(--muted)}
.field input,.field select,.field textarea{border:1px solid var(--line);background:var(--panel);border-radius:9px;padding:9px 11px;width:100%}
.field textarea{min-height:120px;resize:vertical}
.fcard{min-height:230px;display:flex;flex-direction:column;justify-content:center;text-align:center;font-size:19px;padding:24px}
.ans{margin-top:14px;padding-top:14px;border-top:1px dashed var(--line);font-size:17px;color:var(--ink)}
.rate{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-top:12px}
.opt{display:block;width:100%;text-align:start;border:1px solid var(--line);background:var(--panel);border-radius:11px;padding:12px;margin:7px 0;direction:ltr}
.opt.ok{border-color:var(--ok);background:#e6f6ee;color:#14532d}.opt.no{border-color:var(--bad);background:#fdeaec;color:#7f1d1d}
html[data-theme=dark] .opt.ok{background:#14382a;color:#a7f3d0}html[data-theme=dark] .opt.no{background:#3d1a20;color:#fecdd3}
.qtxt{direction:ltr;text-align:left;font-weight:600;font-size:16px;margin-bottom:8px}
.expl{margin-top:10px;padding:10px 12px;background:var(--acc2);border-radius:10px;font-size:14px}
.res{display:grid;gap:6px;margin-top:12px}.res div{display:flex;justify-content:space-between;gap:10px;padding:8px 12px;background:var(--acc2);border-radius:9px}
.res b{direction:ltr}
.stat{text-align:center}.stat b{display:block;font-size:26px}.stat span{font-size:12px;color:var(--muted)}
.nav2{position:fixed;inset-inline:0;bottom:0;background:var(--nav);display:none;z-index:30;padding-bottom:env(safe-area-inset-bottom)}
.nav2 button{flex:1;background:none;border:0;color:#a9c0d0;padding:9px 2px 7px;font-size:11px;position:relative}.nav2 button .i{display:block;font-size:19px}.nav2 button.on{color:#fff}
.nav2 .bd{position:absolute;top:3px;inset-inline-start:55%;background:var(--gold);color:#222;border-radius:20px;font-size:10px;padding:0 6px;font-weight:700}
.player{position:fixed;inset-inline:0;bottom:0;background:var(--panel);border-top:1px solid var(--line);padding:9px 14px;z-index:25;display:none;box-shadow:0 -6px 20px #0002}
.toast{position:fixed;inset-inline:0;bottom:90px;margin:auto;width:max-content;max-width:90vw;background:#111c;color:#fff;padding:10px 16px;border-radius:30px;z-index:60;font-size:13px;backdrop-filter:blur(4px)}
.fab{position:fixed;inset-inline-end:14px;bottom:14px}
.hidden{display:none!important}
@media(max-width:820px){.side{display:none}.main{margin-inline-start:0;padding:14px 14px 150px}.nav2{display:flex}.grid{grid-template-columns:1fr 1fr}h1{font-size:21px}.top{position:sticky;top:0;background:var(--bg);padding:6px 0;z-index:10}body.pl .player{bottom:56px}}
@media(max-width:480px){.grid{grid-template-columns:1fr}}
body.pl .player{display:block}
body.pl .main{padding-bottom:210px}
</style>
</head>
<body>
<aside class="side" id="side"></aside>
<main class="main">
  <div class="top">
    <input id="q" type="search" placeholder="" oninput="A.search(this.value)">
    <button class="ib" onclick="A.lang()" id="langb">EN</button>
    <button class="ib" onclick="A.theme()" id="themeb">🌓</button>
  </div>
  <div id="view"></div>
</main>
<nav class="nav2" id="nav2"></nav>
<div class="player" id="player"></div>
<script src="content/core.js"></script>
<script src="content/pack-fnd.js"></script>
<script src="content/pack-cma.js"></script>
<script src="content/pack-cma1a.js"></script>
<script src="content/pack-cma1b.js"></script>
<script src="content/pack-cpa.js"></script>
<script src="content/pack-cfa.js"></script>
<script src="content/pack-lib.js"></script>
<script src="app1.js"></script>
<script src="app2.js"></script>
<script src="app3.js"></script>
</body>
</html>
